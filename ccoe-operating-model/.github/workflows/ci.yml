name: ccoe-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate RACI, ADRs, guardrails, exceptions
        run: make validate
      - name: Unit tests
        run: make test
      - name: Diagrams build with zero layout warnings
        run: make diagrams
      - name: Good plan must pass
        run: PYTHONPATH=src python -m ccoe check-plan tests/fixtures/plan_good.json
      - name: Bad plan must be blocked
        run: |
          if PYTHONPATH=src python -m ccoe check-plan tests/fixtures/plan_bad.json --today 2026-11-24; then echo "bad plan was not blocked"; exit 1; fi
  policy-check-for-consumers:
    # Reusable pattern: copy this job into any Terraform repo.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          terraform init && terraform plan -out tf.plan && terraform show -json tf.plan > plan.json
          pip install git+https://github.com/Adamson-lab/ccoe-operating-model
          ccoe --root . check-plan plan.json --format markdown >> "$GITHUB_STEP_SUMMARY"
